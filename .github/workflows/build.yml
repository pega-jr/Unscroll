name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Locate project and build
      run: |
        # Chercher le dossier contenant pubspec.yaml
        PUBSPEC_PATH=$(find . -name "pubspec.yaml" | head -n 1)
        
        if [[ -z "$PUBSPEC_PATH" ]]; then
          echo "Erreur : Aucun fichier pubspec.yaml trouvé dans le dépôt."
          exit 1
        fi

        PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
        echo "Dossier du projet trouvé : $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Installation des dépendances et compilation
        flutter pub get
        flutter build ios --release --no-codesign

        # Préparation du dossier Payload
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r Unscroll.ipa Payload
        
        # Déplacer l'IPA à la racine du dépôt
        mv Unscroll.ipa $GITHUB_WORKSPACE/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unscroll-IPA
        path: Unscroll.ipa
