name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install dependencies & Build
      run: |
        # Installation des paquets Node.js si package.json existe
        if [ -f "package.json" ]; then
          echo "Projet React Native / JS détecté"
          npm install
        fi

        # Recherche des fichiers projets Xcode
        WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
        XCODEPROJ=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)

        if [ -n "$WORKSPACE" ]; then
          TARGET_DIR=$(dirname "$WORKSPACE")
          cd "$TARGET_DIR"
          # Installation des pods si Podfile présent
          if [ -f "Podfile" ]; then
            pod install
          fi
          SCHEME=$(xcodebuild -list -workspace "$(basename "$WORKSPACE")" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          xcodebuild -workspace "$(basename "$WORKSPACE")" -scheme "$SCHEME" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
        elif [ -n "$XCODEPROJ" ]; then
          TARGET_DIR=$(dirname "$XCODEPROJ")
          cd "$TARGET_DIR"
          SCHEME=$(xcodebuild -list -project "$(basename "$XCODEPROJ")" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          xcodebuild -project "$(basename "$XCODEPROJ")" -scheme "$SCHEME" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
        else
          echo "Erreur : Aucun projet iOS trouvé."
          exit 1
        fi

        # Génération du .ipa
        mkdir -p Payload
        APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r Unscroll.ipa Payload
        mv Unscroll.ipa $GITHUB_WORKSPACE/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unscroll-IPA
        path: Unscroll.ipa
